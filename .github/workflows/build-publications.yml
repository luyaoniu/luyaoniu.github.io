name: Build publications page

on:
  push:
    branches: [master]
    paths:
      - "mybib.bib"
      - "scripts/bib_to_publications.py"
      - "scripts/requirements.txt"
      - ".github/workflows/build-publications.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Regenerate publications page
        run: python scripts/bib_to_publications.py

      - name: Commit regenerated files if changed
        run: |
          if [[ -n "$(git status --porcelain _pages/publications.md _data/featured_publications.yml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _pages/publications.md _data/featured_publications.yml
            git commit -m "chore: regenerate publications page [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
